services:
  app:
    container_name: vesper_app
    build: .
    ports:
      - "80:8080" # Mapea puerto 80 (Host/VPS) a 8080 (Contenedor)
    env_file:
      - .env
    # environment:
      # Las variables se cargan directamente desde .env con env_file
      # Esto evita problemas si docker compose no las resuelve antes

        db:
          condition: service_healthy # <--- Esto evita el error "Connection Refused"
    networks:
      - vesper-net

  db:
    container_name: vesper_db
    image: mysql:8.0
    restart: always
    ports:
      - "3307:3306"
    environment:
      - MYSQL_DATABASE=vesper_db
      - MYSQL_USER=${DB_USERNAME}
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DB_ROOT_PASSWORD}
      - TZ=America/Argentina/Buenos_Aires
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - vesper-net

volumes:
  # Volumen para persistencia de datos MySQL
  db_data:

networks:
  # Red para comunicación interna entre contenedores
  vesper-net:
    driver: bridge
