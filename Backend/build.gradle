plugins {
    id 'java'
        id 'org.springframework.boot' version '3.2.6'
        id 'io.spring.dependency-management' version '1.1.5' }

group = 'org'
version = '0.0.1-SNAPSHOT'
description = 'Vesper'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url "https://repo1.maven.org/maven2/" }
    maven { url "https://oss.sonatype.org/content/groups/public/" }
}

dependencies {

    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // ===============================
    // Core Spring Boot
    // ===============================
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // JPA + Hibernate
    implementation 'org.springframework.boot:spring-boot-starter-security' // Spring Security
    implementation 'org.springframework.boot:spring-boot-starter-validation' // Validaciones DTOs/entidades
    implementation 'org.springframework.boot:spring-boot-starter-web' // REST + Spring MVC
    implementation 'com.cloudinary:cloudinary-http44:1.37.0' // Cliente Cloudinary para manejo de imágenes

    // ===============================
    // Mercado Pago
    // ===============================
    implementation 'com.mercadopago:sdk-java:2.1.19'

    // ===============================
    // Lombok
    // ===============================
    compileOnly 'org.projectlombok:lombok' // Solo para compilación, reduce boilerplate
    annotationProcessor 'org.projectlombok:lombok' // Procesa anotaciones Lombok

    // ===============================
    // Desarrollo
    // ===============================
    developmentOnly 'org.springframework.boot:spring-boot-devtools' // Hot reload local

    // ===============================
    // Bases de datos
    // ===============================

    // MySQL
    runtimeOnly 'com.mysql:mysql-connector-j'


    // ===============================
    // Testing
    // ===============================
    testImplementation 'org.springframework.boot:spring-boot-starter-test' // JUnit, Mockito
    testImplementation 'org.springframework.security:spring-security-test' // Test de endpoints seguros
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher' // Ejecutar tests con JUnit Platform

    // ===============================
    // Correo electrónico
    // ===============================
    implementation 'org.springframework.boot:spring-boot-starter-mail' // Enviar emails (recuperación de contraseña)

    // ===============================
    // Soporte para .env
    // ===============================
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'

}

tasks.named('test') {
    useJUnitPlatform()
}

processResources {
    // Esto le dice a Gradle: "Además de lo normal..."
    
    // 1. Ve a la carpeta del Frontend (subiendo un nivel)
    from('../Frontend') {
        // 2. Y mete esos archivos dentro de la carpeta 'static' del JAR
        into 'static'
    }
}