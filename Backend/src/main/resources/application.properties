spring.application.name=Vesper
spring.config.import=optional:file:.env[.properties]
# ===============================
# = LOGGING
# ===============================
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ===============================
# = AUTH0 CONFIG
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI}
auth0.audience=${AUTH0_AUDIENCE}

# ===============================
# = CORS
# ===============================
web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===============================
# = DATA SOURCE (MySQL)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===============================
# = SERVER
# ===============================
server.port=${SERVER_PORT:8080}

# ===============================


# ===============================
# CLOUDINARY CONFIG
# ===============================
cloudinary.url=${CLOUDINARY_URL}

# ===============================
# SPRING UPLOAD CONFIG
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# MERCADO PAGO
# ===============================
mercadopago.access-token=${MP_ACCESS_TOKEN}
mercadopago.base.url=${MP_BASE_URL}
mercadopago.webhook.secret=${MP_WEBHOOK_SECRET}
mercadopago.public-key=${MP_PUBLIC_KEY}

# ===============================
# UALA CONFIG
# ===============================
uala.auth.url=${UALA_AUTH_URL}
uala.checkout.url=${UALA_CHECKOUT_URL}
uala.username=${UALA_USERNAME}
uala.client-id=${UALA_CLIENT_ID}
uala.client-secret=${UALA_CLIENT_SECRET}

# ===============================
# URLS CONFIG
# ===============================
# URL base del frontend (Live Server)
frontend.base.url=${FRONTEND_BASE_URL}
# URL pública de tu aplicación (para redirecciones de pago)
app.public.url=${APP_PUBLIC_URL}