spring.application.name=Vesper

# ===============================
# = AUTH0 CONFIG
# ===============================
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER_URI}
auth0.audience=${AUTH0_AUDIENCE}

# ===============================
# = CORS
# ===============================
web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# ===============================
# = DATA SOURCE (MySQL)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===============================
# = JWT
# ===============================
# jwt.secret=${JWT_SECRET} # Descomentar si se usa para JWT propios
# jwt.expiration=604800000  # 7 días

# ===============================
# = SERVER
# ===============================
server.port=8080

# ===============================
# = EMAIL
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# ===============================
# CLOUDINARY CONFIG (tu cuenta)
# ===============================
cloudinary.url=${CLOUDINARY_URL}

# ===============================
# SPRING UPLOAD CONFIG
# ===============================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# MERCADO PAGO
# ===============================
# Lee el Access Token desde una variable de entorno del sistema llamada MERCADOPAGO_ACCESS_TOKEN
mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN}
# URL base para los callbacks de Mercado Pago (ngrok o despliegue)
mercadopago.base.url=${MERCADOPAGO_BASE_URL}
mercadopago.webhook.secret=${MERCADOPAGO_WEBHOOK_SECRET}
