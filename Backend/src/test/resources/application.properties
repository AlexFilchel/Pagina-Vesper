spring.datasource.url=jdbc:h2:mem:vesper_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.sql.init.mode=never
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
web.cors.allowed-origins=http://localhost
cloudinary.cloud_name=
cloudinary.api_key=
cloudinary.api_secret=
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://vesperarg.us.auth0.com/
auth0.audience=https://vesper/api
jwt.secret=test-secret
spring.main.allow-bean-definition-overriding=true
auth0.test-mode=true
